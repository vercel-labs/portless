minimumReleaseAge: 2880
# tsc-ts and its platform packages are Vercel Labs packages, exempt so the
# type-check can use a just-released tsc-ts.
minimumReleaseAgeExclude:
  - "@vercel/agent-readability@0.5.1"
  - "tsc-ts"
  - "@tsc-ts/*"

allowBuilds:
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  msw: false
  node-liblzma: false
  sharp: false

packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"
  - "tests/e2e/fixtures/*"
  - "examples/*"

patchedDependencies:
  next@16.3.4: patches/next@16.3.4.patch
